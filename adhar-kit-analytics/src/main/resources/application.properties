# Adhar Analytics Configuration

# Enable/disable analytics
adhar.analytics.enabled=true

# Event Tracking
adhar.analytics.event-tracking.enabled=true
adhar.analytics.event-tracking.kafka-topic=analytics-events
adhar.analytics.event-tracking.track-page-views=true
adhar.analytics.event-tracking.track-user-actions=true
adhar.analytics.event-tracking.track-business-events=true
adhar.analytics.event-tracking.batch-size=100
adhar.analytics.event-tracking.flush-interval=5000

# Reporting
adhar.analytics.reporting.enabled=true
adhar.analytics.reporting.output-directory=/tmp/reports
adhar.analytics.reporting.enable-csv=true
adhar.analytics.reporting.enable-excel=true
adhar.analytics.reporting.enable-pdf=false
adhar.analytics.reporting.enable-scheduled-reports=false
adhar.analytics.reporting.schedule-expression=0 0 0 * * ?

# Aggregation
adhar.analytics.aggregation.enabled=true
adhar.analytics.aggregation.real-time-aggregation=true
adhar.analytics.aggregation.aggregation-window-minutes=5
adhar.analytics.aggregation.persist-aggregates=true

