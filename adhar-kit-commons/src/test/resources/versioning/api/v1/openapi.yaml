openapi: 3.0.3
info:
  title: Pets API
  version: 1.2.0
paths:
  /api/v1/pets/{id}:
    get:
      operationId: getPet
      tags: [pets]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: The pet
        '404':
          description: No such pet
          content:
            application/problem+json:
              schema: {type: object}
