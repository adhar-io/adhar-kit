# Adhar Config Configuration

# Enable/disable config features
adhar.config.enabled=true

# Spring Cloud Config
adhar.config.cloud-config.enabled=false
adhar.config.cloud-config.uri=http://localhost:8888
adhar.config.cloud-config.label=master
adhar.config.cloud-config.profile=default
adhar.config.cloud-config.fail-fast=false
adhar.config.cloud-config.connect-timeout=5000
adhar.config.cloud-config.read-timeout=5000

# Vault
adhar.config.vault.enabled=false
adhar.config.vault.host=localhost
adhar.config.vault.port=8200
adhar.config.vault.scheme=http
adhar.config.vault.backend=secret
adhar.config.vault.default-context=application
adhar.config.vault.connection-timeout=5000
adhar.config.vault.read-timeout=15000

# Encryption
adhar.config.encryption.enabled=false
adhar.config.encryption.algorithm=PBEWithMD5AndDES
adhar.config.encryption.key-obtention-iterations=1000
adhar.config.encryption.pool-size=1
adhar.config.encryption.string-output-type=base64

# Refresh
adhar.config.refresh.enabled=true
adhar.config.refresh.auto-refresh=false
adhar.config.refresh.refresh-interval=60000

