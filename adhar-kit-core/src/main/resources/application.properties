# Adhar Kit Core Configuration
# Framework-agnostic core utilities

# Core Features
adhar.core.enabled=true

# Async Configuration
adhar.core.async.enabled=true
adhar.core.async.pool-size=10
adhar.core.async.max-pool-size=50
adhar.core.async.queue-capacity=100
adhar.core.async.thread-name-prefix=adhar-async-
adhar.core.async.keep-alive-seconds=60

# Retry Configuration
adhar.core.retry.enabled=true
adhar.core.retry.max-attempts=3
adhar.core.retry.initial-delay=1000
adhar.core.retry.max-delay=30000
adhar.core.retry.backoff-multiplier=2.0

# Circuit Breaker Configuration
adhar.core.circuit-breaker.enabled=true
adhar.core.circuit-breaker.failure-threshold=5
adhar.core.circuit-breaker.success-threshold=2
adhar.core.circuit-breaker.timeout-duration=60000
adhar.core.circuit-breaker.half-open-wait-duration=30000

# Cache Configuration
adhar.core.cache.enabled=true
adhar.core.cache.max-size=1000
adhar.core.cache.ttl=300
adhar.core.cache.tti=180

# Validation Configuration
adhar.core.validation.enabled=true
adhar.core.validation.fail-fast=true
adhar.core.validation.validate-on-startup=true

