# Adhar Kit Dapr Configuration

# Dapr Features
adhar.dapr.enabled=true
adhar.dapr.app-id=my-service
adhar.dapr.app-port=8080

# Dapr Sidecar Ports
adhar.dapr.dapr-port=3500
adhar.dapr.dapr-http-port=3500
adhar.dapr.dapr-grpc-port=50001

# Default Component Names
adhar.dapr.state-store=statestore
adhar.dapr.pubsub=pubsub
adhar.dapr.secret-store=secretstore

# State Store Configuration
adhar.dapr.state-store-config.enabled=true
adhar.dapr.state-store-config.component-name=statestore
adhar.dapr.state-store-config.consistency=eventual
adhar.dapr.state-store-config.concurrency=first-write

# Pub/Sub Configuration
adhar.dapr.pub-sub-config.enabled=true
adhar.dapr.pub-sub-config.component-name=pubsub
adhar.dapr.pub-sub-config.dead-letter-topic=dead-letter

