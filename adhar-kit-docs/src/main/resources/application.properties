# Adhar Docs Configuration

# Enable/disable API documentation
adhar.docs.enabled=true

# API Information
adhar.docs.api-info.title=API Documentation
adhar.docs.api-info.description=REST API Documentation
adhar.docs.api-info.version=1.0.0
adhar.docs.api-info.terms-of-service=
adhar.docs.api-info.contact.name=API Support
adhar.docs.api-info.contact.email=support@example.com
adhar.docs.api-info.contact.url=
adhar.docs.api-info.license.name=Apache 2.0
adhar.docs.api-info.license.url=https://www.apache.org/licenses/LICENSE-2.0

# Swagger UI
adhar.docs.swagger-ui.enabled=true
adhar.docs.swagger-ui.path=/swagger-ui.html
adhar.docs.swagger-ui.display-request-duration=true
adhar.docs.swagger-ui.show-extensions=true
adhar.docs.swagger-ui.try-it-out-enabled=true

# Security
adhar.docs.security.enabled=false
adhar.docs.security.scheme-name=bearerAuth
adhar.docs.security.scheme=bearer
adhar.docs.security.bearer-format=JWT
adhar.docs.security.description=JWT Authentication

# Springdoc Settings
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

