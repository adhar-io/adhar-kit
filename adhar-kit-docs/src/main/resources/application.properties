# Adhar Kit Docs - OpenAPI/Swagger Configuration
# Comprehensive API documentation setup for enterprise microservices

adhar.docs.enabled=true

# API Information
adhar.docs.info.title=API Documentation
adhar.docs.info.version=1.0.0
adhar.docs.info.description=Microservice API Documentation
adhar.docs.info.terms-of-service=https://example.com/terms

# Contact Information
adhar.docs.info.contact.name=API Support
adhar.docs.info.contact.email=api-support@example.com
adhar.docs.info.contact.url=https://example.com/support

# License Information
adhar.docs.info.license.name=Apache 2.0
adhar.docs.info.license.url=https://www.apache.org/licenses/LICENSE-2.0

# Server Configuration
adhar.docs.servers[0].url=http://localhost:8080
adhar.docs.servers[0].description=Local Development Server
adhar.docs.servers[1].url=https://api-dev.example.com
adhar.docs.servers[1].description=Development Environment
adhar.docs.servers[2].url=https://api.example.com
adhar.docs.servers[2].description=Production Environment

# Security Configuration
adhar.docs.security.enabled=true
adhar.docs.security.jwt-enabled=true
adhar.docs.security.api-key-enabled=false
adhar.docs.security.oauth2-enabled=false
adhar.docs.security.basic-auth-enabled=false
adhar.docs.security.api-key-header=X-API-KEY

# Swagger UI Configuration
adhar.docs.swagger-ui.enabled=true
adhar.docs.swagger-ui.path=/swagger-ui.html
adhar.docs.swagger-ui.config-url=/v3/api-docs/swagger-config
adhar.docs.swagger-ui.display-request-duration=true
adhar.docs.swagger-ui.show-extensions=true
adhar.docs.swagger-ui.show-common-extensions=true
adhar.docs.swagger-ui.default-models-expand-depth=1
adhar.docs.swagger-ui.default-model-expand-depth=1
adhar.docs.swagger-ui.doc-expansion=none
adhar.docs.swagger-ui.filter=false
adhar.docs.swagger-ui.show-request-headers=false

# Documentation Paths
adhar.docs.paths.api-docs=/v3/api-docs
adhar.docs.paths.api-docs-yaml=/v3/api-docs.yaml
adhar.docs.paths.packages-to-scan[0]=com.example.api
adhar.docs.paths.paths-to-match[0]=/api/**
adhar.docs.paths.paths-to-exclude[0]=/api/internal/**

