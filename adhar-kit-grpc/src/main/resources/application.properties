# Adhar Kit gRPC - Enterprise Microservices Configuration
# Comprehensive gRPC server and client configuration

# ========================================
# SERVER CONFIGURATION
# ========================================
adhar.grpc.server.enabled=true
adhar.grpc.server.port=9090
adhar.grpc.server.address=0.0.0.0

# Message Size Limits
adhar.grpc.server.max-inbound-message-size=4194304
adhar.grpc.server.max-inbound-header-list-size=8192

# Thread Pool
adhar.grpc.server.executor-thread-pool-size=100

# Keep Alive
adhar.grpc.server.keep-alive-time=300
adhar.grpc.server.keep-alive-timeout=20
adhar.grpc.server.permit-keep-alive-without-calls=false
adhar.grpc.server.permit-keep-alive-time=300

# Services
adhar.grpc.server.enable-reflection=true
adhar.grpc.server.enable-health-check=true

# Shutdown
adhar.grpc.server.shutdown-grace-period=30

# ========================================
# CLIENT CONFIGURATION
# ========================================
adhar.grpc.client.default-target=localhost:9090

# Default Channel Settings
adhar.grpc.client.defaults.enable-load-balancing=true
adhar.grpc.client.defaults.load-balancing-policy=round_robin
adhar.grpc.client.defaults.enable-retry=true
adhar.grpc.client.defaults.max-retry-attempts=3
adhar.grpc.client.defaults.default-timeout=60000
adhar.grpc.client.defaults.max-inbound-message-size=4194304
adhar.grpc.client.defaults.keep-alive-time=300
adhar.grpc.client.defaults.keep-alive-timeout=20
adhar.grpc.client.defaults.keep-alive-without-calls=false
adhar.grpc.client.defaults.enable-tls=false
adhar.grpc.client.defaults.user-agent=adhar-grpc-client/1.0.0

# Named Channels (example)
# Order Service Channel
adhar.grpc.client.channels.order-service.target=localhost:9090
adhar.grpc.client.channels.order-service.enable-retry=true
adhar.grpc.client.channels.order-service.max-retry-attempts=3

# Inventory Service Channel
adhar.grpc.client.channels.inventory-service.target=localhost:9091
adhar.grpc.client.channels.inventory-service.enable-retry=true
adhar.grpc.client.channels.inventory-service.default-timeout=30000

# ========================================
# SECURITY CONFIGURATION
# ========================================
adhar.grpc.security.enabled=false
adhar.grpc.security.enable-tls=false
adhar.grpc.security.enable-mtls=false
adhar.grpc.security.client-auth=NONE

# TLS Certificates (when enabled)
#adhar.grpc.security.cert-chain=classpath:certs/server.crt
#adhar.grpc.security.private-key=classpath:certs/server.key
#adhar.grpc.security.trust-cert-collection=classpath:certs/ca.crt

# ========================================
# OBSERVABILITY CONFIGURATION
# ========================================
adhar.grpc.observability.enable-metrics=true
adhar.grpc.observability.enable-tracing=true
adhar.grpc.observability.enable-logging=true
adhar.grpc.observability.log-level=BASIC
adhar.grpc.observability.enable-health-check=true

