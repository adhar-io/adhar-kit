# Adhar Kit Health - Enterprise Health Check Configuration

# ========================================
# HEALTH CHECK CONFIGURATION
# ========================================
adhar.health.enabled=true
adhar.health.show-details=always
adhar.health.show-components=true

# Endpoints
adhar.health.endpoint=/health
adhar.health.readiness-endpoint=/health/ready
adhar.health.liveness-endpoint=/health/live

# ========================================
# DATABASE HEALTH
# ========================================
adhar.health.database.enabled=true
adhar.health.database.timeout=5000
adhar.health.database.validation-query=SELECT 1

# ========================================
# REDIS HEALTH
# ========================================
adhar.health.redis.enabled=true
adhar.health.redis.timeout=3000

# ========================================
# KAFKA HEALTH
# ========================================
adhar.health.kafka.enabled=true
adhar.health.kafka.timeout=5000

# ========================================
# MONGODB HEALTH
# ========================================
adhar.health.mongo.enabled=true
adhar.health.mongo.timeout=3000

# ========================================
# ELASTICSEARCH HEALTH
# ========================================
adhar.health.elasticsearch.enabled=true
adhar.health.elasticsearch.timeout=3000

# ========================================
# GRPC HEALTH
# ========================================
adhar.health.grpc.enabled=true
adhar.health.grpc.timeout=3000

