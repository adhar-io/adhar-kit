# Adhar Kit Kubernetes - Enterprise Kubernetes Integration Configuration

# ========================================
# KUBERNETES CLIENT CONFIGURATION
# ========================================
adhar.kubernetes.enabled=true
adhar.kubernetes.namespace=default
adhar.kubernetes.api-version=v1

# Master URL (optional, auto-detected if not set)
#adhar.kubernetes.master-url=https://kubernetes.default.svc

# ========================================
# SERVICE DISCOVERY
# ========================================
adhar.kubernetes.discovery.enabled=true
adhar.kubernetes.discovery.all-namespaces=false
adhar.kubernetes.discovery.service-label=app
adhar.kubernetes.discovery.cache-refresh-interval=30000

# ========================================
# CONFIGMAP CONFIGURATION
# ========================================
adhar.kubernetes.config-map.enabled=true
#adhar.kubernetes.config-map.name=app-config
adhar.kubernetes.config-map.watch-enabled=true
adhar.kubernetes.config-map.watch-interval=10000

# ========================================
# SECRET CONFIGURATION
# ========================================
adhar.kubernetes.secret.enabled=true
#adhar.kubernetes.secret.name=app-secrets
adhar.kubernetes.secret.watch-enabled=true
adhar.kubernetes.secret.watch-interval=10000

# ========================================
# LEADER ELECTION
# ========================================
adhar.kubernetes.leader-election.enabled=false
adhar.kubernetes.leader-election.lock-name=leader-election
adhar.kubernetes.leader-election.lease-duration=15000
adhar.kubernetes.leader-election.renew-deadline=10000
adhar.kubernetes.leader-election.retry-period=2000

# ========================================
# POD INFORMATION
# ========================================
adhar.kubernetes.pod.enabled=true
# Pod info is auto-detected from environment variables:
# - POD_NAME (from HOSTNAME)
# - POD_IP
# - NODE_NAME
# - POD_NAMESPACE

# ========================================
# RESOURCE MONITORING (NEW)
# ========================================
adhar.kubernetes.monitoring.enabled=true
adhar.kubernetes.monitoring.cpu-threshold=80
adhar.kubernetes.monitoring.memory-threshold=80
adhar.kubernetes.monitoring.check-interval=60000

# ========================================
# DEPLOYMENT MANAGEMENT (NEW)
# ========================================
adhar.kubernetes.deployment.enabled=true
adhar.kubernetes.deployment.auto-scale=false
adhar.kubernetes.deployment.min-replicas=1
adhar.kubernetes.deployment.max-replicas=10

# ========================================
# INGRESS MANAGEMENT (NEW)
# ========================================
adhar.kubernetes.ingress.enabled=true
adhar.kubernetes.ingress.watch-enabled=true

# ========================================
# NAMESPACE MANAGEMENT (NEW)
# ========================================
adhar.kubernetes.namespace-management.enabled=true
adhar.kubernetes.namespace-management.auto-create=false


