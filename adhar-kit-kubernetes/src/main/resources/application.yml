# Adhar Kit Kubernetes - Enterprise Kubernetes Integration Configuration

adhar:
  kubernetes:
    enabled: true
    namespace: "default"
    api-version: "v1"

    # Master URL (optional, auto-detected if not set)
    # master-url: "https://kubernetes.default.svc"

    # ========================================
    # SERVICE DISCOVERY
    # ========================================
    discovery:
      enabled: true
      all-namespaces: false
      service-label: "app"
      cache-refresh-interval: 30000  # 30 seconds

    # ========================================
    # CONFIGMAP CONFIGURATION
    # ========================================
    config-map:
      enabled: true
      # name: "app-config"
      watch-enabled: true
      watch-interval: 10000  # 10 seconds

    # ========================================
    # SECRET CONFIGURATION
    # ========================================
    secret:
      enabled: true
      # name: "app-secrets"
      watch-enabled: true
      watch-interval: 10000  # 10 seconds

    # ========================================
    # LEADER ELECTION
    # ========================================
    leader-election:
      enabled: false
      lock-name: "leader-election"
      lease-duration: 15000   # 15 seconds
      renew-deadline: 10000   # 10 seconds
      retry-period: 2000      # 2 seconds

    # ========================================
    # POD INFORMATION
    # ========================================
    pod:
      enabled: true
      # Pod info is auto-detected from environment variables:
      # - POD_NAME (from HOSTNAME)
      # - POD_IP
      # - NODE_NAME
      # - POD_NAMESPACE

    # ========================================
    # RESOURCE MONITORING (NEW)
    # ========================================
    monitoring:
      enabled: true
      cpu-threshold: 80        # CPU usage threshold %
      memory-threshold: 80     # Memory usage threshold %
      check-interval: 60000    # 1 minute

    # ========================================
    # DEPLOYMENT MANAGEMENT (NEW)
    # ========================================
    deployment:
      enabled: true
      auto-scale: false
      min-replicas: 1
      max-replicas: 10

    # ========================================
    # INGRESS MANAGEMENT (NEW)
    # ========================================
    ingress:
      enabled: true
      watch-enabled: true

    # ========================================
    # NAMESPACE MANAGEMENT (NEW)
    # ========================================
    namespace-management:
      enabled: true
      auto-create: false

# ========================================
# KUBERNETES DEPLOYMENT EXAMPLE
# ========================================
# Add these environment variables to your Kubernetes deployment:
#
# env:
# - name: POD_NAME
#   valueFrom:
#     fieldRef:
#       fieldPath: metadata.name
# - name: POD_NAMESPACE
#   valueFrom:
#     fieldRef:
#       fieldPath: metadata.namespace
# - name: POD_IP
#   valueFrom:
#     fieldRef:
#       fieldPath: status.podIP
# - name: NODE_NAME
#   valueFrom:
#     fieldRef:
#       fieldPath: spec.nodeName

