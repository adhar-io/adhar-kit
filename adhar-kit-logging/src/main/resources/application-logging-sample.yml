# Adhar Kit Logging Configuration Sample
# Add this to your application.yml or application.properties

adhar:
  logging:
    # Enable/disable the entire logging framework
    enabled: true

    # AOP-based logging aspects configuration
    aspects:
      enabled: true                    # Enable declarative logging annotations

    # Sensitive data masking configuration
    masking:
      enabled: true                    # Enable automatic data masking
      strategy: FULL                   # FULL | PARTIAL (keep last 4) | HASH (sha256 prefix)
      mask-credit-cards: true          # Mask credit-card-like numbers in free text
      mask-ssn: true                   # Mask SSNs (NNN-NN-NNNN) in free text
      mask-emails: false               # Mask e-mail addresses in free text
      custom-patterns:                 # Extra regexes whose matches are masked
        - "ACC-\\d{6}"
      additional-keys:                 # Additional field names to mask beyond defaults
        - customSecret
        - apiKey
        - internalToken
        - clientSecret

    # Structured application log events (AppLogEvent pipeline)
    events:
      enabled: true                    # Enable the AppLogEvent publishing pipeline
      logger-prefix: ADHAR_EVENT       # Events are logged to <prefix>.<TYPE> loggers

    # REST API request/response logging
    rest-api:
      enabled: true                    # Log every API exchange as a structured API event
      interceptor-enabled: true        # Also track controller handler execution (Spring MVC)
      include-headers: false           # Capture request headers (sensitive ones masked)
      include-request-payload: false   # Capture request body (masked, truncated)
      include-response-payload: false  # Capture response body (masked, truncated)
      include-query-string: true
      max-payload-length: 2048         # Max captured payload characters
      slow-request-threshold-ms: 3000  # Slower requests are flagged and logged at WARN
      exclude-paths:                   # Ant-style patterns skipped by API logging
        - /actuator/**
        - /health/**
        - /static/**
      masked-headers:                  # Headers always masked in API events
        - authorization
        - cookie
        - x-api-key

    # Batch job logging
    batch:
      enabled: true
      progress-log-interval: 1000      # Emit a progress event every N processed items
      max-item-errors-logged: 10       # Detailed item-error events per job run (rest counted)

    # Performance logging
    performance:
      enabled: true
      slow-threshold-ms: 1000          # Operations slower than this are logged at WARN
      log-all-operations: false        # true = emit an event for every recorded operation

    # Audit logging
    audit:
      enabled: true
      include-changes: true            # Allow before/after change values (masked) in audit events

    # MDC (Mapped Diagnostic Context) configuration
    mdc:
      enabled: true                    # Enable MDC context management
      include-correlation-id: true     # Include correlation IDs in logs
      include-user-info: true          # Include user information in logs
      correlation-id-field: correlationId
      user-id-field: userId
      session-id-field: sessionId

    # Distributed tracing integration
    tracing:
      enabled: true                    # Enable tracing integration
      include-trace-id: true           # Include trace IDs in logs
      include-span-id: true            # Include span IDs in logs
      include-parent-id: true          # Include parent span IDs in logs
      trace-id-field: traceId
      span-id-field: spanId
      parent-id-field: parentId

    # JSON encoder configuration
    json-encoder:
      include-mdc: true                # Include MDC in JSON logs
      custom-fields:                   # Custom fields to add to all logs
        application: "${spring.application.name}"
        version: "@project.version@"
        environment: "${spring.profiles.active}"

# Standard Spring Boot logging configuration
logging:
  level:
    # Set debug level for Adhar logging framework
    com.adhar.adharkit.logging: DEBUG

    # Set levels for your application packages
    com.yourcompany.yourapp: INFO

    # Audit and metrics loggers
    AUDIT: INFO
    METRICS: INFO

    # Root level
    root: INFO

  # Structured logging configuration
  pattern:
    # Console pattern for development
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

    # File pattern for production (JSON format recommended)
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

