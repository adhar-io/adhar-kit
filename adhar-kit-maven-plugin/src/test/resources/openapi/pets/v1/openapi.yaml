openapi: 3.0.3
info:
  title: Pets API
  version: 1.2.0
servers:
  - url: https://pets.example.com
tags:
  - name: pets
  - name: owners
paths:
  /api/v1/pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: The pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '4XX':
          $ref: '#/components/responses/Problem'
  /api/v1/pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getPet
      tags: [pets]
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePet
      tags: [pets]
      responses:
        '204':
          description: Deleted
        default:
          description: Any failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/owners/{ownerId}:
    get:
      operationId: getOwner
      tags: [owners]
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '5XX':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: An RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [available, sold]
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    Owner:
      type: object
      properties:
        id:
          type: string
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
