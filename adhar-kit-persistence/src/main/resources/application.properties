# Adhar Persistence Configuration

# Enable/disable persistence features
adhar.persistence.enabled=true

# JPA Auditing
adhar.persistence.enable-auditing=true

# Multi-Tenancy
adhar.persistence.enable-multi-tenancy=false
adhar.persistence.multi-tenancy-strategy=SCHEMA

# Soft Delete
adhar.persistence.enable-soft-delete=true

# Database Migration (Flyway)
adhar.persistence.migration.enabled=true
adhar.persistence.migration.baseline-on-migrate=true
adhar.persistence.migration.clean-on-validation-error=false
adhar.persistence.migration.locations=classpath:db/migration

# Connection Pool (HikariCP)
adhar.persistence.connection-pool.maximum-pool-size=10
adhar.persistence.connection-pool.minimum-idle=5
adhar.persistence.connection-pool.connection-timeout=30000
adhar.persistence.connection-pool.idle-timeout=600000
adhar.persistence.connection-pool.max-lifetime=1800000
adhar.persistence.connection-pool.pool-name=AdharHikariCP

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

