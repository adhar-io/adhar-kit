# Adhar Resilience Configuration

# Enable/disable resilience features
adhar.resilience.enabled=true

# Metrics Configuration
adhar.resilience.metrics.enabled=true
adhar.resilience.metrics.export-circuit-breaker-metrics=true
adhar.resilience.metrics.export-retry-metrics=true
adhar.resilience.metrics.export-rate-limiter-metrics=true
adhar.resilience.metrics.export-bulkhead-metrics=true
adhar.resilience.metrics.export-time-limiter-metrics=true

# Default Circuit Breaker Configuration
# adhar.resilience.circuit-breaker.default.failure-rate-threshold=50.0
# adhar.resilience.circuit-breaker.default.slow-call-rate-threshold=100.0
# adhar.resilience.circuit-breaker.default.slow-call-duration-threshold=60s
# adhar.resilience.circuit-breaker.default.sliding-window-size=100
# adhar.resilience.circuit-breaker.default.minimum-number-of-calls=10
# adhar.resilience.circuit-breaker.default.permitted-number-of-calls-in-half-open-state=10
# adhar.resilience.circuit-breaker.default.wait-duration-in-open-state=60s

# Default Retry Configuration
# adhar.resilience.retry.default.max-attempts=3
# adhar.resilience.retry.default.wait-duration=500ms
# adhar.resilience.retry.default.enable-exponential-backoff=false
# adhar.resilience.retry.default.exponential-backoff-multiplier=1.5

# Default Rate Limiter Configuration
# adhar.resilience.rate-limiter.default.limit-for-period=10
# adhar.resilience.rate-limiter.default.limit-refresh-period=1s
# adhar.resilience.rate-limiter.default.timeout-duration=5s

# Default Bulkhead Configuration
# adhar.resilience.bulkhead.default.max-concurrent-calls=25
# adhar.resilience.bulkhead.default.max-wait-duration=0ms

# Default Time Limiter Configuration
# adhar.resilience.time-limiter.default.timeout-duration=1s
# adhar.resilience.time-limiter.default.cancel-running-future=true
org.springframework.boot.autoconfigure.EnableAutoConfiguration=\
com.adhar.kit.resilience.config.ResilienceAutoConfiguration

