# Adhar Kit Starter Configuration

# Enable Adhar Kit
adhar.kit.enabled=true

# Profile (WEB, REACTIVE, BATCH, MINIMAL)
adhar.kit.profile=WEB

# Module Configuration
adhar.kit.modules.logging=true
adhar.kit.modules.metrics=true
adhar.kit.modules.tracing=true
adhar.kit.modules.resilience=true
adhar.kit.modules.security=true
adhar.kit.modules.persistence=true
adhar.kit.modules.cache=true
adhar.kit.modules.messaging=true
adhar.kit.modules.config=true
adhar.kit.modules.health=true
adhar.kit.modules.docs=true
adhar.kit.modules.ai=false
adhar.kit.modules.analytics=false
adhar.kit.modules.kubernetes=false
adhar.kit.modules.dapr=false
adhar.kit.modules.grpc=false

